<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>いろのあいだ | ビスケット背景カラー</title><meta name="description" content="ふたつのダイアルでビスケットの背景色を作り、bgのJSONに変換。"><style>:root{font-family:Inter,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#28372f;background:#f7f8f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #438761;outline-offset:4px}header{height:84px;border-bottom:1px solid #e0e5dc;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#fcfdf9}.brand{color:inherit;text-decoration:none;font-weight:750;letter-spacing:.04em;font-size:22px;display:flex;align-items:center;gap:12px}.logo{font-size:35px;color:#497b58}.brand small{font-size:12px;color:#7d887f;font-weight:400;letter-spacing:.01em;margin-left:6px}.header-note{font-size:12px;color:#7d887f}main{max-width:1360px;margin:auto;padding:44px 5vw 22px}.intro{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#65836b;font-weight:700}h1{font-size:clamp(23px,2.5vw,32px);font-weight:650;letter-spacing:.015em;margin:12px 0}p{font-size:13px;color:#7b867e;line-height:1.9;margin:0}.quiet{background:transparent;border:1px solid #dce3d7;border-radius:9px;padding:11px 15px;color:#5c6c5e;font-size:12px}.quiet:hover{background:#edf1e8}.workspace{display:grid;grid-template-columns:1.15fr 1fr;gap:26px}.controls,.preview-panel,.presets,.json-panel{background:#fff;border:1px solid #e1e6db;border-radius:17px}.controls{padding:25px 25px 15px}#editors{display:grid;grid-template-columns:1fr 1fr;gap:25px}.editor+.editor{border-left:1px solid #edf0e8;padding-left:25px}.editor-title{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 22px}.number{width:23px;height:23px;border:1px solid #dce4d6;display:grid;place-items:center;font-size:10px;border-radius:50%;color:#7b8879}.editor-title small{margin-left:auto;color:#94a08f;font-size:10px;letter-spacing:.09em}.wheel{width:100%;aspect-ratio:1;border-radius:50%;position:relative;background:conic-gradient(from 0deg,#f44,#ff4,#4f4,#4ff,#44f,#f4f,#f44);touch-action:none;cursor:crosshair;box-shadow:0 3px 10px #28372f0c}.wheel::before{content:"";position:absolute;inset:18px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px #00000004}.wheel-center{position:absolute;inset:27px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;gap:7px}.center-swatch{width:29px;height:29px;border-radius:50%;border:1px solid #00000010}.rgb-label{font-size:9px;letter-spacing:.18em;color:#8c978d}.rgb-value{font-family:ui-monospace,SFMono-Regular,monospace;font-size:clamp(11px,1.2vw,16px);white-space:nowrap}.wheel-handle{position:absolute;top:0;left:0;width:18px;height:18px;border:3px solid white;border-radius:50%;box-shadow:0 1px 7px #0005;pointer-events:none;transform:translate(-50%,-50%)}.dial-hint{text-align:center;font-size:10px;color:#95a08e;margin:13px 0 22px}.slider-row{margin:15px 0}.slider-label{display:flex;justify-content:space-between;font-size:11px;color:#6c796c}.slider-label output{font-family:monospace;color:#96a08f}input[type=range]{width:100%;height:8px;border-radius:8px;appearance:none;margin:12px 0 0;cursor:pointer}input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;background:#fff;border:2px solid #526c53;border-radius:50%;box-shadow:0 1px 3px #0002}input[type=range]::-moz-range-thumb{width:13px;height:13px;background:#fff;border:2px solid #526c53;border-radius:50%}.value-inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:21px}.value-inputs label{font-size:9px;color:#8b9788}.value-inputs input{width:100%;margin-top:6px;border:1px solid #e1e7dc;border-radius:6px;padding:7px 3px;text-align:center;font:12px ui-monospace,monospace;color:#40543f;appearance:textfield}.value-inputs input::-webkit-inner-spin-button{appearance:none}.decimal{font-size:10px;color:#9aa491;text-align:center;margin:15px 0 0}.decimal b{font-family:monospace;font-weight:400;color:#6c7e62;margin-left:5px}.swap-row{text-align:center;border-top:1px solid #eef1e9;margin-top:22px;padding-top:14px}.swap-row button{border:0}.preview-panel{padding:24px;display:flex;flex-direction:column}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}h2{font-size:13px;margin:0;font-weight:600}.panel-title>span{font-size:10px;color:#8b9883;white-space:nowrap}.live{display:inline-block;background:#6e9b75;width:6px;height:6px;border-radius:50%;margin-right:4px}.preview{min-height:280px;flex:1;border-radius:10px;position:relative;border:1px solid #00000005}.edge-label{position:absolute;left:14px;font-size:9px;letter-spacing:.14em;padding:5px 8px;border-radius:4px;background:#fff9;color:#28372f}.top{top:14px}.bottom{bottom:14px}.preview-footer{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font:11px ui-monospace,monospace;color:#6e7f69}.preview-footer span{display:flex;align-items:center;gap:7px}.preview-footer i{display:inline-block;width:13px;height:13px;border:1px solid #0001;border-radius:50%}.preview-footer b{font-weight:400}.line-arrow{color:#a4af9c}.bottom-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;margin-top:25px}.presets,.json-panel{padding:23px 25px}#presets{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.preset{border:0;padding:0;background:transparent;text-align:left;color:#7b8873;font-size:10px}.preset-swatch{height:62px;border-radius:7px;display:block;border:1px solid #00000008;margin-bottom:10px}.preset:hover .preset-swatch{outline:2px solid #91aa84;outline-offset:3px}.copy{font-size:10px;background:#edf2e8;color:#4a6e43;border:0;padding:9px 12px;border-radius:7px}.copy span{margin-left:10px}pre{font:14px/1.8 ui-monospace,SFMono-Regular,monospace;background:#f6f8f1;border:1px solid #e9eee0;padding:17px 20px;border-radius:8px;color:#48653c;margin:0;white-space:pre-wrap}details{margin-top:13px;font-size:10px;color:#86947c}summary{cursor:pointer}details p{font-size:11px;margin:10px 0}textarea{display:block;width:100%;height:70px;border:1px solid #dce4d5;border-radius:6px;padding:8px;margin:8px 0;font:12px monospace;resize:vertical}footer{display:flex;justify-content:space-between;margin-top:28px;font-size:10px;color:#94a08b}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#344a35;color:white;font-size:13px;padding:13px 22px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}@media(min-width:1350px){main{padding-left:45px;padding-right:45px}.wheel{max-width:220px;margin:auto}}@media(max-width:950px){main{padding:30px 25px}.workspace,.bottom-grid{grid-template-columns:1fr 1fr;gap:16px}.controls{padding:20px 15px 12px}#editors{gap:15px}.editor+.editor{padding-left:15px}.wheel::before{inset:14px}.wheel-center{inset:20px}.rgb-value{font-size:10px}.editor-title small{display:none}.preview-panel{padding:20px 16px}.presets,.json-panel{padding:20px 16px}.header-note{display:none}}@media(max-width:700px){header{height:68px;padding:0 22px}.brand{font-size:19px}main{padding:28px 18px}.intro{display:block}.intro>.quiet{margin-top:18px}.workspace,.bottom-grid{grid-template-columns:1fr}.controls{padding:24px 20px 12px}#editors{gap:24px}.editor+.editor{padding-left:24px}.wheel{max-width:230px;margin:auto}.rgb-value{font-size:12px}.preview{min-height:310px}.preview-panel{padding:22px}.bottom-grid{gap:16px;margin-top:16px}footer{display:block;line-height:2}footer span{display:block}.panel-title>span{font-size:9px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* Circular swatches and tone grid echo the Viscuit color controls. */
.wheel{background:transparent;box-shadow:none}.wheel::before{display:none}.hue-dot{position:absolute;width:17%;height:17%;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.wheel-center{inset:26%;background:#f8faf5;gap:6px;border:1px solid #edf0e7}.center-swatch{width:23px;height:23px}.wheel-handle{z-index:2;width:20px;height:20px;border-color:#fff;box-shadow:0 0 0 2px #394f3c,0 2px 5px #0003}.tone-palette{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:20px}.tone-palette button{width:100%;aspect-ratio:1;border-radius:50%;border:1px solid #0000000b;padding:0}.tone-palette button:hover{outline:2px solid #6c8264;outline-offset:2px}.dial-hint{margin-bottom:16px}.preview{min-height:370px}.rgb-value{font-size:11px}.rgb-label{font-size:8px}@media(max-width:950px) and (min-width:701px){.rgb-value{font-size:8px}.wheel-center{gap:3px}.center-swatch{width:16px;height:16px}.rgb-label{font-size:7px}}@media(max-width:700px){.preview{min-height:310px}.rgb-value{font-size:11px}}
#editors{gap:0}.editor{min-width:0;padding-right:15px}.editor+.editor{padding-right:0;padding-left:15px}.wheel{max-width:220px;margin:auto}.rgb-value{font-size:clamp(9px,1vw,12px)}@media(max-width:900px){.workspace,.bottom-grid{grid-template-columns:1fr}.wheel-center{gap:6px}.center-swatch{width:23px;height:23px}.rgb-label{font-size:8px}.rgb-value{font-size:12px}.preview{min-height:330px}}@media(max-width:400px){.rgb-value{font-size:9px}}
</style></head><body>
<header><a class="brand" href="./"><span class="logo">◒</span> いろのあいだ <small>for Viscuit</small></a><span class="header-note">ビスケットの背景カラーづくり</span></header>
<main><div class="intro"><div><div class="eyebrow">GRADIENT COLOR STUDIO</div><h1>ふたつの色で、世界をつくろう。</h1><p>ダイアルをくるっと回すと、背景が変わります。</p></div><button id="reset" class="quiet">↺ はじめの色に戻す</button></div>
<div class="workspace"><section class="controls" aria-label="背景色の設定"><div id="editors"></div><div class="swap-row"><button id="swap" class="quiet">⇅ 上と下の色を入れ替える</button></div></section>
<section class="preview-panel"><div class="panel-title"><h2>背景プレビュー</h2><span><i class="live"></i> リアルタイム</span></div><div class="preview" id="preview"><span class="edge-label top">上側</span><span class="edge-label bottom">下側</span></div><div class="preview-footer"><span><i id="topDot"></i><b id="topHex"></b></span><span class="line-arrow">↓</span><span><i id="bottomDot"></i><b id="bottomHex"></b></span></div></section></div>
<section class="bottom-grid"><div class="presets"><div class="panel-title"><h2>配色からはじめる</h2><span>クリックでおためし</span></div><div id="presets"></div></div><div class="json-panel"><div class="panel-title"><h2>ビスケット用 JSON</h2><button id="copy" class="copy">JSONをコピー <span>⧉</span></button></div><pre id="json"></pre><details><summary>JSONを読み込む・数値のしくみ</summary><p>bgの先頭が上側、次が下側。数値は R × 65536 + G × 256 + B で変換しています。</p><label for="import">bgの断片または作品JSONを貼り付け</label><textarea id="import" placeholder='"bg": [0, 69221]'></textarea><button id="load" class="quiet">この色を読み込む</button><p id="importStatus" role="status"></p></details></div></section>
<footer><span>色を選ぶ → グラデーションを見る → JSONをコピー</span><span>ビスケット用の非公式カラーツール</span></footer></main><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s);
const unpack=n=>[(n>>16)&255,(n>>8)&255,n&255];
const pack=rgb=>rgb[0]*65536+rgb[1]*256+rgb[2];
const hex=rgb=>'#'+pack(rgb).toString(16).padStart(6,'0').toUpperCase();
function toHSV(rgb){let [r,g,b]=rgb.map(v=>v/255),max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h=0;if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return [h,max===0?0:d/max,max]}
function toRGB([h,s,v]){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let p=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return p.map(n=>Math.round((n+m)*255))}
let colors=[unpack(0),unpack(69221)],hsv=colors.map(toHSV);
const definitions=[['上側の色','TOP'],['下側の色','BOTTOM']];
$('#editors').innerHTML=definitions.map(([name,en],i)=>`<article class="editor" data-index="${i}"><h2 class="editor-title"><span class="number">0${i+1}</span>${name}<small>${en}</small></h2><div class="wheel" role="slider" tabindex="0" aria-label="${name}の色相" aria-valuemin="0" aria-valuemax="359"><div class="wheel-center"><span class="center-swatch"></span><span class="rgb-label">RGB</span><span class="rgb-value"></span></div><span class="wheel-handle"></span></div><p class="dial-hint">色の輪をドラッグして選ぶ</p><div class="slider-row"><label class="slider-label" for="s${i}">鮮やかさ<output class="s-output"></output></label><input id="s${i}" class="saturation" aria-label="${name}の鮮やかさ" type="range" min="0" max="100" step="0.1"></div><div class="slider-row"><label class="slider-label" for="v${i}">明るさ<output class="v-output"></output></label><input id="v${i}" class="brightness" aria-label="${name}の明るさ" type="range" min="0" max="100" step="0.1"></div><div class="value-inputs">${['R','G','B'].map((c,j)=>`<label>${c}<input type="number" min="0" max="255" step="1" aria-label="${name} ${c}" data-channel="${j}"></label>`).join('')}</div><p class="decimal">JSON値 <b class="packed"></b></p></article>`).join('');
const editors=[...document.querySelectorAll('.editor')];
editors.forEach((el,i)=>{
 const wheel=el.querySelector('.wheel');
 for(let k=0;k<12;k++){let dot=document.createElement('span');dot.className='hue-dot';dot.style.background=`hsl(${k*30} 100% 50%)`;dot.style.left=50+41*Math.sin(k*Math.PI/6)+'%';dot.style.top=50-41*Math.cos(k*Math.PI/6)+'%';wheel.append(dot)}
 const palette=document.createElement('div');palette.className='tone-palette';palette.setAttribute('aria-label',definitions[i][0]+'の色パレット');
 for(let row=0;row<6;row++)for(let col=0;col<6;col++){const b=document.createElement('button');b.type='button';b.dataset.s=col/5;b.dataset.v=1-row/5;b.setAttribute('aria-label',definitions[i][0]+` 鮮やかさ${col*20}% 明るさ${100-row*20}%`);b.onclick=()=>{hsv[i][1]=col/5;hsv[i][2]=1-row/5;hsvChange(i)};palette.append(b)}
 el.querySelector('.dial-hint').after(palette);
});
function render(){editors.forEach((el,i)=>{const [h,s,v]=hsv[i],rgb=colors[i],wheel=el.querySelector('.wheel');wheel.setAttribute('aria-valuenow',Math.round(h)%360);wheel.setAttribute('aria-valuetext',`${Math.round(h)}度、RGB ${rgb.join(', ')}`);el.querySelector('.center-swatch').style.background=hex(rgb);el.querySelector('.rgb-value').textContent=rgb.join(', ');el.querySelector('.saturation').value=s*100;el.querySelector('.brightness').value=v*100;el.querySelector('.s-output').textContent=Math.round(s*100)+'%';el.querySelector('.v-output').textContent=Math.round(v*100)+'%';el.querySelector('.saturation').style.background=`linear-gradient(to right, #ddd, hsl(${h} 100% 50%))`;el.querySelector('.brightness').style.background=`linear-gradient(to right, #101510, ${hex(toRGB([h,s,1]))})`;el.querySelectorAll('[data-channel]').forEach((input,j)=>{if(document.activeElement!==input)input.value=rgb[j]});el.querySelectorAll('.tone-palette button').forEach(b=>b.style.background=hex(toRGB([h,+b.dataset.s,+b.dataset.v])));el.querySelector('.packed').textContent=pack(rgb);const angle=h*Math.PI/180,r=wheel.clientWidth*.41;const handle=el.querySelector('.wheel-handle');handle.style.left=wheel.clientWidth/2+Math.sin(angle)*r+'px';handle.style.top=wheel.clientWidth/2-Math.cos(angle)*r+'px';handle.style.background=`hsl(${h} 100% 50%)`});$('#preview').style.background=`linear-gradient(to bottom, ${hex(colors[0])}, ${hex(colors[1])})`;['top','bottom'].forEach((name,i)=>{$('#'+name+'Hex').textContent=hex(colors[i]);$('#'+name+'Dot').style.background=hex(colors[i])});$('#json').textContent=`"bg": [\n  ${pack(colors[0])},\n  ${pack(colors[1])}\n],`;try{localStorage.setItem('viscuit-bg',JSON.stringify(colors.map(pack)))}catch{}}
function hsvChange(i){colors[i]=toRGB(hsv[i]);render()}
editors.forEach((el,i)=>{const wheel=el.querySelector('.wheel');function pointer(e){const rect=wheel.getBoundingClientRect();hsv[i][0]=(Math.atan2(e.clientX-rect.left-rect.width/2,-(e.clientY-rect.top-rect.height/2))*180/Math.PI+360)%360;/* A black or gray starting color needs chroma to make hue selection visible. */if(hsv[i][2]===0){hsv[i][1]=1;hsv[i][2]=1}else if(hsv[i][1]===0)hsv[i][1]=1;hsvChange(i)}wheel.addEventListener('pointerdown',e=>{wheel.setPointerCapture(e.pointerId);pointer(e)});wheel.addEventListener('pointermove',e=>{if(wheel.hasPointerCapture(e.pointerId))pointer(e)});wheel.addEventListener('keydown',e=>{const delta={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(delta){e.preventDefault();hsv[i][0]=(hsv[i][0]+delta*(e.shiftKey?10:1)+360)%360;if(hsv[i][2]===0){hsv[i][1]=1;hsv[i][2]=1}else if(hsv[i][1]===0)hsv[i][1]=1;hsvChange(i)}});['saturation','brightness'].forEach((cls,j)=>el.querySelector('.'+cls).addEventListener('input',e=>{hsv[i][j+1]=+e.target.value/100;hsvChange(i)}));el.querySelectorAll('[data-channel]').forEach((input,j)=>{input.addEventListener('input',()=>{if(input.value===''||!Number.isFinite(input.valueAsNumber))return;colors[i][j]=Math.min(255,Math.max(0,Math.round(input.valueAsNumber)));const oldH=hsv[i][0];hsv[i]=toHSV(colors[i]);if(hsv[i][1]===0)hsv[i][0]=oldH;render()});input.addEventListener('blur',()=>{input.value=colors[i][j]})})});
function setPair(pair){colors=pair.map(unpack);hsv=colors.map(toHSV);render()}
const presets=[['夜の青',0,69221],['ももの空',16756684,16773540],['水のなか',0x67c2df,0xd4f0da],['夕暮れ',0x8778b6,0xffb888]];
$('#presets').innerHTML=presets.map(([name,a,b],i)=>`<button class="preset" data-preset="${i}" aria-label="${name}の配色を使う"><span class="preset-swatch" style="background:linear-gradient(${hex(unpack(a))},${hex(unpack(b))})"></span>${name}</button>`).join('');document.querySelectorAll('[data-preset]').forEach(el=>el.onclick=()=>setPair(presets[+el.dataset.preset].slice(1)));
$('#swap').onclick=()=>{colors.reverse();hsv.reverse();render()};$('#reset').onclick=()=>setPair([0,69221]);
let toastTimer;function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2400)}
$('#copy').onclick=async()=>{const text=$('#json').textContent;try{await navigator.clipboard.writeText(text);toast('JSONをコピーしました')}catch{const range=document.createRange();range.selectNodeContents($('#json'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);toast('JSONを選択しました。コピーしてください')}};
$('#load').onclick=()=>{try{let raw=$('#import').value.trim(),obj;try{obj=JSON.parse(raw)}catch{obj=JSON.parse('{'+raw.replace(/,\s*$/,'')+'}')}const bg=Array.isArray(obj)?obj:obj.bg;if(!Array.isArray(bg)||bg.length!==2||!bg.every(n=>Number.isInteger(n)&&n>=0&&n<=16777215))throw Error();setPair(bg);$('#importStatus').textContent='色を読み込みました。'}catch{$('#importStatus').textContent='0〜16777215の整数2つを含むbgを入力してください。'}};
try{const saved=JSON.parse(localStorage.getItem('viscuit-bg'));if(Array.isArray(saved)&&saved.length===2&&saved.every(n=>Number.isInteger(n)&&n>=0&&n<=16777215)){colors=saved.map(unpack);hsv=colors.map(toHSV)}}catch{}
new ResizeObserver(render).observe($('#editors'));render();
</script></body></html>
